
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SayAnything</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #202536;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 850px;
    text-align: center;
}

h1 {
    color: white;
    font-size: 48px;
    margin-bottom: 10px;
    letter-spacing: 2px;
}

.subtitle {
    color: #b8bfd0;
    margin-bottom: 35px;
}

.questions {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 30px;
}

.question-card {
    background: white;
    border-radius: 14px;
    padding: 25px;
    min-height: 120px;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    font-size: 23px;
    font-weight: 600;
    color: #30384d;
    line-height: 1.5;
    animation: fadeIn 0.3s ease;
}

.question-number {
    color: #64748b;
    font-size: 13px;
    display: block;
    margin-bottom: 10px;
    font-weight: normal;
}

button {
    background: #e85d75;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background: #d94360; }

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

#status {
    color: #b8bfd0;
    margin-top: 20px;
    font-size: 14px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
    h1 { font-size: 36px; }
    .question-card { font-size: 19px; }
}
</style>
</head>

<body>

<div class="container">

    <h1>SayAnything</h1>

    <div class="subtitle">
        Three questions. Endless conversations.
    </div>

    <div class="questions" id="questions">
        <div class="question-card">Loading questions...</div>
    </div>

    <button id="randomButton"
            onclick="randomizeQuestions()"
            disabled>
        RANDOMIZE
    </button>

    <div id="status">Loading Questions.txt...</div>

</div>

<script>

let allQuestions = [];
let previousQuestions = [];

// Automatically request access to the app folder
async function loadQuestions() {

    const status = document.getElementById("status");

    try {

        if (!window.showDirectoryPicker) {
            throw new Error(
                "Folder access is not supported by this browser. Use Chrome or Edge and run through localhost."
            );
        }

        status.textContent = "Please select your SayAnything folder...";

        // Select the folder containing index.html and Questions.txt
        const directory = await window.showDirectoryPicker();

        // Automatically read Questions.txt
        const fileHandle = await directory.getFileHandle("Questions.txt");

        const file = await fileHandle.getFile();

        const text = await file.text();

        allQuestions = text
            .split(/\r?\n/)
            .map(q => q.trim())
            .filter(q => q.length > 0);

        if (allQuestions.length < 3) {
            throw new Error("At least 3 questions are required.");
        }

        previousQuestions = [];

        status.textContent =
            allQuestions.length + " questions loaded successfully.";

        document.getElementById("randomButton").disabled = false;

        randomizeQuestions();

    } catch (error) {

        status.textContent = "Unable to load Questions.txt: " + error.message;

    }
}


// Randomize three questions
function randomizeQuestions() {

    if (allQuestions.length < 3) return;

    let shuffled = [...allQuestions];

    for (let i = shuffled.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
            [shuffled[j], shuffled[i]];

    }

    // Avoid repeating the previous three questions
    if (allQuestions.length > 3) {

        let attempts = 0;

        while (
            shuffled.slice(0, 3).some(
                q => previousQuestions.includes(q)
            ) && attempts < 100
        ) {

            for (let i = shuffled.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [shuffled[i], shuffled[j]] =
                    [shuffled[j], shuffled[i]];

            }

            attempts++;
        }
    }

    const selected = shuffled.slice(0, 3);

    previousQuestions = selected;

    displayQuestions(selected);
}


// Display three questions
function displayQuestions(selected) {

    const container = document.getElementById("questions");

    container.innerHTML = "";

    selected.forEach((question, index) => {

        const card = document.createElement("div");
        card.className = "question-card";

        const content = document.createElement("div");

        const number = document.createElement("span");
        number.className = "question-number";
        number.textContent = "QUESTION " + (index + 1);

        const text = document.createElement("div");
        text.textContent = question;

        content.appendChild(number);
        content.appendChild(text);
        card.appendChild(content);

        container.appendChild(card);

    });
}


// Start app
window.addEventListener("DOMContentLoaded", loadQuestions);

</script>

</body>
</html>
