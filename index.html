}

button {

    border: none;
    border-radius: 10px;
    padding: 17px 45px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #d94360;
    transform: scale(1.04);
}

button:active {
    transform: scale(0.98);
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    h1 {
        font-size: 36px;
    }

    .question-card {
        font-size: 19px;
        padding: 25px 15px;
        min-height: 110px;
    }

    button {
        width: 100%;
    }
}
</style>

const QUESTIONS_PER_ROUND = 3;

let previousQuestions = [];


// =====================================
// RANDOMIZE THREE QUESTIONS
// =====================================

function randomizeQuestions() {

    let shuffled = [...allQuestions];

    // Shuffle the questions
    for (let i = shuffled.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
            [shuffled[j], shuffled[i]];

    }

    // Avoid repeating questions from previous round
    if (allQuestions.length > QUESTIONS_PER_ROUND) {

        let attempts = 0;

        while (
            shuffled.slice(0, QUESTIONS_PER_ROUND)
                .some(q => previousQuestions.includes(q))
            && attempts < 100
        ) {

            for (let i = shuffled.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [shuffled[i], shuffled[j]] =
                    [shuffled[j], shuffled[i]];

            }

            attempts++;
        }
    }

    const selectedQuestions =
        shuffled.slice(0, QUESTIONS_PER_ROUND);

    previousQuestions = selectedQuestions;

    displayQuestions(selectedQuestions);

}


// =====================================
// DISPLAY QUESTIONS
// =====================================

function displayQuestions(selectedQuestions) {

    const container = document.getElementById("questions");

    container.innerHTML = "";

    selectedQuestions.forEach((question, index) => {

        const card = document.createElement("div");

        card.className = "question-card";

        const content = document.createElement("div");

        const number = document.createElement("span");

        number.className = "question-number";

        number.textContent = "QUESTION " + (index + 1);

        const text = document.createElement("div");

        text.textContent = question;

        content.appendChild(number);
        content.appendChild(text);

        card.appendChild(content);

        container.appendChild(card);

    });

}

randomizeQuestions();

</script>
